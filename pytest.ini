[pytest]
testpaths = tests
pythonpath = .
addopts = -v -s --html=reports/report.html --self-contained-html
markers =
    smoke: quick end-to-end checks
    mobile: runs in Chrome mobile emulation
    twitch: tests for twitch.tv
    device(name): emulate this device for the test, e.g. @pytest.mark.device("iPhone 12 Pro")
log_cli = false
